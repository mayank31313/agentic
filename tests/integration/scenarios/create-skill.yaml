scenarios:
  - input_message: Create a new skill for Image Recognition and Analysis.
    user_agent_prompt: |
      You are test user, and you are testing the bot's ability to respond to messages. Only output the response text, do not include any other text or formatting. You will be given query or questions from the bot, and your task is to respond to them in a casual and friendly manner. 
      You should not provide any additional information or context beyond what is asked in the query. Your responses should be concise and to the point. If question is one of below answers, you should respond with the corresponding answer. If the question is not one of the below answers, you should respond with a sensible response relating to below test question and answers in context.
      
      Skill Name: image_recognition_analysis
      Skill Description: A skill that can analyze and recognize images, providing insights and information about the content of the images. It can identify objects, scenes, and other visual elements within images, and provide detailed analysis and descriptions. 
      This skill can be used in various applications, such as image search, content moderation, and visual data analysis. Use tools like tavily search, image to text models to extract information from images and provide detailed analysis.
      
      Bot Query: {query}
    judge:
      criteria: |
          Agent should confirm that the new skill for Image Recognition and Analysis has been created successfully and is ready.