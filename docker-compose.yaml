services:
  bot:
    build:
      context: .
      dockerfile: .dockerfile
      platforms:
        - linux/amd64
    image: ghcr.io/mayank31313/agentic
    environment:
      # Secrets are resolved via the env secrets provider (see
      # resources/application.yml, "env://<VAR>" references). Populate these
      # from a .env file (see .env.example) — never hardcode real values here.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      GITHUB_MCP_PAT_TOKEN: ${GITHUB_MCP_PAT_TOKEN}
    ports:
    - 5000:5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    depends_on:
      mcp:
        condition: service_healthy
    volumes:
      - ./resources:/bot/resources:ro
      - ./workspace:/bot/workspace
      - ./downloads:/bot/downloads
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 512M

  mcp:
    image: ghcr.io/mayank31313/agentic
    command:
      - uv
      - run
      - agentic
      - mcp
      - run
    volumes:
      - ./credentials/client_secret.json:/creds/credentials.json:ro
      - ./credentials/google_creds_token.json:/creds/google_creds_token.json
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8811/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    environment:
      AGENTIC_MCP_HOST: 0.0.0.0
      AGENTIC_BOT_LOCAL_API_BASE_URL: ${AGENTIC_BOT_LOCAL_API_BASE_URL}
      AGENTIC_BOT_LOCAL_API_IMAGE_MODEL: ${AGENTIC_BOT_LOCAL_API_IMAGE_MODEL}
      GOOGLE_CREDENTIALS_FILE: /creds/credentials.json
      OPEN_WEATHER_API_KEY: ${OPEN_WEATHER_API_KEY}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    ports:
      - 8082:8811
