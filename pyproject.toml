[project]
name = "agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mayank Shinde", email = "mayank31313@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "click>=8.4.2",
    "cndi==2.7.9",
    "deepagents>=0.6.12",
    "elasticsearch>=8.0.0",
    "fastmcp>=3.4.4",
    "hvac>=2.4.0",
    "jsonpath-ng>=1.8.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.3.3",
    "langchain-tavily>=0.2.18",
    "mcp[cli]>=1.28.0",
    "pyyaml>=6.0.3",
    "pytest-repeat>=0.9.4",
    "python-telegram-bot>=22.8",
    "tinydb>=4.8.2",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "proxmoxer>=2.3.0",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
agentic = "agentic:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[pytest]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
