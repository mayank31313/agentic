name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.17"

      - name: Run Integration Tests
        env:
          AGENTIC_BOT_LOCAL_API_BASE_URL: ${{ secrets.AGENTIC_BOT_LOCAL_API_BASE_URL }}
          AGENTIC_BOT_LOCAL_API_IMAGE_MODEL: ${{ secrets.AGENTIC_BOT_LOCAL_API_IMAGE_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cp .env.test .env
          uv sync --group test
          uv run pytest --log-cli-level=INFO  --cache-clear

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build-and-push.outputs.digest }}"

